[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sequana_report"
version = "0.1.0"
description = "Shared HTML report generation infrastructure for Sequana"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Sequana Development Team", email = "thomas.cokelaer@pasteur.fr"}
]
license = {text = "BSD-3-Clause"}
keywords = ["bioinformatics", "ngs", "sequencing", "html", "reporting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: BSD License",
]

dependencies = [
    "jinja2>=3.0",
    "colorlog>=6.0",
    "pandas>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "isort>=5.0",
    "flake8>=3.9",
    "pre-commit>=2.0",
]

[project.urls]
Homepage = "https://github.com/sequana/sequana_report"
Documentation = "https://sequana.readthedocs.io"
Repository = "https://github.com/sequana/sequana_report"

[tool.setuptools]
packages = ["sequana_report"]
package-data = {sequana_report = [
    "resources/css/*.css",
    "resources/js/*.js",
    "resources/images/*",
    "resources/templates/*.html",
]}

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--cov=sequana_report --cov-report=term-missing"
